<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150">
<title>Let's build something together</title>
<style>
.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
.s{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
@keyframes blink{50%{opacity:0}} .cur{animation:blink 1.1s steps(1) infinite}
@keyframes pulse{0%{r:4;opacity:.9}100%{r:13;opacity:0}} .pl{animation:pulse 2s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.u1{animation:up .7s .2s both}.u2{animation:up .7s .5s both}.u3{animation:up .7s .8s both}
@keyframes sw{from{transform:translateX(-300px)}to{transform:translateX(1180px)}} .sw{animation:sw 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cur,.pl,.u1,.u2,.u3,.sw{animation:none}}
</style>
<defs>
<linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset=".45" stop-color="#1A7F37" stop-opacity="0.05"/><stop offset="1" stop-color="#1A7F37" stop-opacity="0.02"/></linearGradient>
<linearGradient id="ge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A7F37" stop-opacity=".45"/><stop offset=".5" stop-color="#1A7F37" stop-opacity=".12"/><stop offset="1" stop-color="#1A7F37" stop-opacity=".3"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect x="1" y="1" width="878" height="148" rx="12"/></clipPath>
</defs>
<rect x="1" y="1" width="878" height="148" rx="12" fill="url(#gf)"/>
<g clip-path="url(#cp)"><rect class="sw" x="0" y="0" width="160" height="150" fill="url(#sh)" transform="skewX(-20)"/></g>
<path d="M14 1.6H866" stroke="#FFFFFF" stroke-opacity=".18" stroke-linecap="round"/>
<rect x="1" y="1" width="878" height="148" rx="12" fill="none" stroke="url(#ge)" stroke-width="1.5"/>
<g class="u1"><text class="m" x="440" y="40" text-anchor="middle" font-size="13" fill="#656D76"><tspan fill="#116329">~</tspan> $ ./say-hello.sh<tspan class="cur" fill="#116329"> &#9608;</tspan></text></g>
<g class="u2"><text class="s" x="440" y="82" text-anchor="middle" font-size="27" font-weight="700" fill="#116329">Let&#8217;s build something together.</text></g>
<g class="u3"><text class="s" x="440" y="114" text-anchor="middle" font-size="14.5" fill="#656D76">A project, a role or just a chat about code. My inbox is always open.</text></g>
<g transform="translate(822 30)"><circle class="pl" r="4" fill="#1A7F37"/><circle r="4" fill="#1A7F37"/></g>
</svg>
