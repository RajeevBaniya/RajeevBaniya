<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" font-family="Consolas,Menlo,monospace">
<style>
:root{--bg:#EEF3FB;--bd:#C3D0E6;--mu:#5B6B8A;--tx:#0B1530;--ac:#1D4ED8;--ok:#10B981}
@media (prefers-color-scheme:dark){:root{--bg:#08112A;--bd:#1B2E55;--mu:#7F93B8;--tx:#E8F0FF;--ac:#38BDF8;--ok:#10B981}}
.n{fill:var(--bg);stroke:var(--bd);stroke-width:2}
.l{fill:var(--mu);font-size:15px;text-anchor:middle}
.c{fill:var(--tx);font-size:16px}
.r{fill:none;stroke:var(--ac);stroke-width:3}
.on{opacity:0}
.s0{animation:s0 10s infinite}@keyframes s0{0%,0%{opacity:0}2%,19%{opacity:1}20%,100%{opacity:0}}
.s1{animation:s1 10s infinite}@keyframes s1{0%,20%{opacity:0}22%,39%{opacity:1}40%,100%{opacity:0}}
.s2{animation:s2 10s infinite}@keyframes s2{0%,40%{opacity:0}42%,59%{opacity:1}60%,100%{opacity:0}}
.s3{animation:s3 10s infinite}@keyframes s3{0%,60%{opacity:0}62%,79%{opacity:1}80%,100%{opacity:0}}
.s4{animation:s4 10s infinite}@keyframes s4{0%,80%{opacity:0}82%,99%{opacity:1}100%,100%{opacity:0}}
.p{animation:pk 10s linear infinite}
@keyframes pk{0%{transform:translateX(0)}80%{transform:translateX(680px)}100%{transform:translateX(680px)}}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
</style>
<rect x="2" y="2" width="896" height="226" rx="16" fill="var(--bg)" stroke="var(--bd)" stroke-width="2"/>
<line x1="110" y1="78" x2="790" y2="78" stroke="var(--bd)" stroke-width="3" stroke-dasharray="6 6"/>
<circle class="p" cx="110" cy="78" r="7" fill="var(--ac)"/>
<circle class="n" cx="110" cy="78" r="26"/><circle class="r on s0" cx="110" cy="78" r="26"/><text class="l" x="110" y="132">1 · IDEA</text><circle class="n" cx="280" cy="78" r="26"/><circle class="r on s1" cx="280" cy="78" r="26"/><text class="l" x="280" y="132">2 · PLAN</text><circle class="n" cx="450" cy="78" r="26"/><circle class="r on s2" cx="450" cy="78" r="26"/><text class="l" x="450" y="132">3 · BUILD</text><circle class="n" cx="620" cy="78" r="26"/><circle class="r on s3" cx="620" cy="78" r="26"/><text class="l" x="620" y="132">4 · SHIP</text><circle class="n" cx="790" cy="78" r="26"/><circle class="r on s4" cx="790" cy="78" r="26"/><text class="l" x="790" y="132">5 · LEARN</text><path d="M790 52 C 790 14, 110 14, 110 52" fill="none" stroke="var(--bd)" stroke-width="2" stroke-dasharray="4 5"/><text class="l" x="450" y="24" font-size="12">loop</text><g class="on s0"><text class="c" x="60" y="190"><tspan fill="var(--ok)">$ </tspan>const idea = await think();<tspan class="cur" fill="var(--ac)">▌</tspan></text></g><g class="on s1"><text class="c" x="60" y="190"><tspan fill="var(--ok)">$ </tspan>const plan = design(idea);<tspan class="cur" fill="var(--ac)">▌</tspan></text></g><g class="on s2"><text class="c" x="60" y="190"><tspan fill="var(--ok)">$ </tspan>const app  = build(plan);<tspan class="cur" fill="var(--ac)">▌</tspan></text></g><g class="on s3"><text class="c" x="60" y="190"><tspan fill="var(--ok)">$ </tspan>deploy(app); // ship it<tspan class="cur" fill="var(--ac)">▌</tspan></text></g><g class="on s4"><text class="c" x="60" y="190"><tspan fill="var(--ok)">$ </tspan>idea = learn(feedback); // loop<tspan class="cur" fill="var(--ac)">▌</tspan></text></g></svg>