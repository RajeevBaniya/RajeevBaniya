ass="lb" x="81.5" y="99">DATA</text></g><g transform="translate(544 17)"><rect class="g" style="animation-delay:3.6s" width="160" height="116" rx="14" fill="var(--ac)" filter="url(#b)"/><rect width="160" height="116" rx="14" fill="url(#t)" stroke="var(--bd)" stroke-width="1.5"/><path d="M30 .8h100" stroke="var(--ac)" stroke-width="1.6" stroke-linecap="round" opacity=".7"/><g class="i" style="animation-delay:3.6s"><g class="ic" transform="translate(48.0 14) scale(1)"><path d="M17 46a10 10 0 0 1 1-20 14 14 0 0 1 27-3 11 11 0 0 1 2 23z"/><path d="M32 52V31M23 39l9-9 9 9"/></g></g><text class="lb" x="81.5" y="99">DEPLOY</text></g><g transform="translate(718 17)"><rect class="g" style="animation-delay:4.8s" width="160" height="116" rx="14" fill="var(--ac)" filter="url(#b)"/><rect width="160" height="116" rx="14" fill="url(#t)" stroke="var(--bd)" stroke-width="1.5"/><path d="M30 .8h100" stroke="var(--ac)" stroke-width="1.6" stroke-linecap="round" opacity=".7"/><g class="i" style="animation-delay:4.8s"><g class="ic" transform="translate(48.0 14) scale(1)"><rect x="15" y="15" width="34" height="34" rx="8"/><path d="M24 8v7M32 8v7M40 8v7M24 49v7M32 49v7M40 49v7M8 24h7M8 32h7M8 40h7M49 24h7M49 32h7M49 40h7"/><path d="M32 23l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" class="fl"/></g></g><text class="lb" x="81.5" y="99">AI</text></g></svg>