<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" font-family="Consolas,Menlo,monospace">
<title>Idea, plan, build, ship, learn</title>
<style>
:root{--bg:#EEF3FB;--t1:#FFFFFF;--t2:#E8EFFA;--bd:#C3D0E6;--mu:#5B6B8A;--ac:#1D4ED8;--gl:.18}
@media (prefers-color-scheme:dark){:root{--bg:#050B1A;--t1:#0B1735;--t2:#08112A;--bd:#1B2E55;--mu:#7F93B8;--ac:#38BDF8;--gl:.35}}
.ic{fill:none;stroke:var(--ac);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ic circle{fill:var(--ac);stroke:none}.fl{fill:var(--ac);fill-opacity:.25}
.lb{fill:var(--mu);font-size:12px;letter-spacing:3px;text-anchor:middle}
.g{opacity:0;animation:p 6s ease-in-out infinite}
@keyframes p{0%,100%{opacity:0}10%,25%{opacity:var(--gl)}40%{opacity:0}}
.i{animation:f 6s ease-in-out infinite}@keyframes f{0%,100%{transform:translateY(0)}15%{transform:translateY(-3px)}30%{transform:translateY(0)}}
</style>
<defs><linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--t1)"/><stop offset="1" stop-color="var(--t2)"/></linearGradient>
<filter id="b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>
<rect x="1" y="1" width="898" height="148" rx="18" fill="var(--bg)" stroke="var(--bd)" stroke-width="2"/>
