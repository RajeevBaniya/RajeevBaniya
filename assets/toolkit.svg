<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150">
<title>Idea, plan, build, ship, learn</title>
<style>:root{--ac:#1D4ED8;--gl:.18}
@media (prefers-color-scheme:dark){:root{--ac:#38BDF8;--gl:.35}}
.ic{fill:none;stroke:var(--ac);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.ic circle{fill:var(--ac);stroke:none}
.cn{stroke:var(--ac);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1 7;opacity:.3}
.br{fill:var(--ac);opacity:.12;animation:br 4s ease-in-out infinite}
.g{fill:var(--ac);opacity:0}
@keyframes br{50%{opacity:calc(var(--gl)*.9)}}
@keyframes bob{50%{transform:translateY(-3.5px)}}
.f{animation:bob 4s ease-in-out infinite}
.f0{animation-delay:-0.0s}.f0 .br{animation-delay:-0.0s}.g0{animation:g0 8s ease-in-out infinite}.c0 .ic{animation:c0 8s ease-in-out infinite}@keyframes g0{0%,0%{opacity:0}2.0%{opacity:calc(var(--gl)*2.4)}14.0%,100%{opacity:0}}@keyframes c0{0%,0%{stroke-width:2.1;opacity:.82}2.0%{stroke-width:2.8;opacity:1}14.0%,100%{stroke-width:2.1;opacity:.82}}.f1{animation-delay:-0.8s}.f1 .br{animation-delay:-0.8s}.g1{animation:g1 8s ease-in-out infinite}.c1 .ic{animation:c1 8s ease-in-out infinite}@keyframes g1{0%,14.0%{opacity:0}17.5%{opacity:calc(var(--gl)*2.4)}29.5%,100%{opacity:0}}@keyframes c1{0%,14.0%{stroke-width:2.1;opacity:.82}17.5%{stroke-width:2.8;opacity:1}29.5%,100%{stroke-width:2.1;opacity:.82}}.f2{animation-delay:-1.6s}.f2 .br{animation-delay:-1.6s}.g2{animation:g2 8s ease-in-out infinite}.c2 .ic{animation:c2 8s ease-in-out infinite}@keyframes g2{0%,29.5%{opacity:0}33.0%{opacity:calc(var(--gl)*2.4)}45.0%,100%{opacity:0}}@keyframes c2{0%,29.5%{stroke-width:2.1;opacity:.82}33.0%{stroke-width:2.8;opacity:1}45.0%,100%{stroke-width:2.1;opacity:.82}}.f3{animation-delay:-2.4s}.f3 .br{animation-delay:-2.4s}.g3{animation:g3 8s ease-in-out infinite}.c3 .ic{animation:c3 8s ease-in-out infinite}@keyframes g3{0%,45.0%{opacity:0}48.5%{opacity:calc(var(--gl)*2.4)}60.5%,100%{opacity:0}}@keyframes c3{0%,45.0%{stroke-width:2.1;opacity:.82}48.5%{stroke-width:2.8;opacity:1}60.5%,100%{stroke-width:2.1;opacity:.82}}.f4{animation-delay:-3.2s}.f4 .br{animation-delay:-3.2s}.g4{animation:g4 8s ease-in-out infinite}.c4 .ic{animation:c4 8s ease-in-out infinite}@keyframes g4{0%,60.5%{opacity:0}64.0%{opacity:calc(var(--gl)*2.4)}76.0%,100%{opacity:0}}@keyframes c4{0%,60.5%{stroke-width:2.1;opacity:.82}64.0%{stroke-width:2.8;opacity:1}76.0%,100%{stroke-width:2.1;opacity:.82}}@media (prefers-reduced-motion:reduce){.f,.br,.g,.ic{animation:none!important}}</style>
<defs><filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<radialGradient id="rg"><stop offset="0" stop-color="var(--ac)" stop-opacity=".85"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></radialGradient>
<linearGradient id="tl" gradientUnits="userSpaceOnUse" x1="-90" y1="0" x2="0" y2="0"><stop offset="0" stop-color="var(--ac)" stop-opacity="0"/><stop offset="1" stop-color="var(--ac)" stop-opacity=".9"/></linearGradient></defs>
