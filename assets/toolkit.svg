<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150">
<title>Idea, plan, build, ship, learn</title>
<style>:root{--ac:#1D4ED8;--mu:#5B6B8A;--ln:#C3D0E6;--gl:.18}
@media (prefers-color-scheme:dark){:root{--ac:#38BDF8;--mu:#7F93B8;--ln:#1B2E55;--gl:.35}}
.ic{fill:none;stroke:var(--mu);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ic circle{fill:currentColor;stroke:none}
.cn{stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1 7}
.g{fill:var(--ac);opacity:0}
@keyframes bob{50%{transform:translateY(-3px)}}
.f{animation:bob 4s ease-in-out infinite}
.f0{animation-delay:-0.0s}.c0{color:var(--mu);animation:k0 8s linear infinite}.c0 .ic{animation:s0 8s linear infinite}.g0{animation:g0 8s linear infinite}@keyframes g0{0%,0%{opacity:0}0.6%,20%{opacity:calc(var(--gl)*2.6)}20.6%,100%{opacity:0}}@keyframes s0{0%,0%{stroke:var(--mu);stroke-width:2.1}0.6%,20%{stroke:var(--ac);stroke-width:2.8}20.6%,100%{stroke:var(--mu);stroke-width:2.1}}@keyframes k0{0%,0%{color:var(--mu)}0.6%,20%{color:var(--ac)}20.6%,100%{color:var(--mu)}}.f1{animation-delay:-0.8s}.c1{color:var(--mu);animation:k1 8s linear infinite}.c1 .ic{animation:s1 8s linear infinite}.g1{animation:g1 8s linear infinite}@keyframes g1{0%,20%{opacity:0}20.6%,40%{opacity:calc(var(--gl)*2.6)}40.6%,100%{opacity:0}}@keyframes s1{0%,20%{stroke:var(--mu);stroke-width:2.1}20.6%,40%{stroke:var(--ac);stroke-width:2.8}40.6%,100%{stroke:var(--mu);stroke-width:2.1}}@keyframes k1{0%,20%{color:var(--mu)}20.6%,40%{color:var(--ac)}40.6%,100%{color:var(--mu)}}.f2{animation-delay:-1.6s}.c2{color:var(--mu);animation:k2 8s linear infinite}.c2 .ic{animation:s2 8s linear infinite}.g2{animation:g2 8s linear infinite}@keyframes g2{0%,40%{opacity:0}40.6%,60%{opacity:calc(var(--gl)*2.6)}60.6%,100%{opacity:0}}@keyframes s2{0%,40%{stroke:var(--mu);stroke-width:2.1}40.6%,60%{stroke:var(--ac);stroke-width:2.8}60.6%,100%{stroke:var(--mu);stroke-width:2.1}}@keyframes k2{0%,40%{color:var(--mu)}40.6%,60%{color:var(--ac)}60.6%,100%{color:var(--mu)}}.f3{animation-delay:-2.4s}.c3{color:var(--mu);animation:k3 8s linear infinite}.c3 .ic{animation:s3 8s linear infinite}.g3{animation:g3 8s linear infinite}@keyframes g3{0%,60%{opacity:0}60.6%,80%{opacity:calc(var(--gl)*2.6)}80.6%,100%{opacity:0}}@keyframes s3{0%,60%{stroke:var(--mu);stroke-width:2.1}60.6%,80%{stroke:var(--ac);stroke-width:2.8}80.6%,100%{stroke:var(--mu);stroke-width:2.1}}@keyframes k3{0%,60%{color:var(--mu)}60.6%,80%{color:var(--ac)}80.6%,100%{color:var(--mu)}}.f4{animation-delay:-3.2s}.c4{color:var(--mu);animation:k4 8s linear infinite}.c4 .ic{animation:s4 8s linear infinite}.g4{animation:g4 8s linear infinite}@keyframes g4{0%{opacity:calc(var(--gl)*2.6)}0.6%,80%{opacity:0}80.6%,100%{opacity:calc(var(--gl)*2.6)}}@keyframes s4{0%{stroke:var(--ac);stroke-width:2.8}0.6%,80%{stroke:var(--mu);stroke-width:2.1}80.6%,100%{stroke:var(--ac);stroke-width:2.8}}@keyframes k4{0%{color:var(--ac)}0.6%,80%{color:var(--mu)}80.6%,100%{color:var(--ac)}}@media (prefers-reduced-motion:reduce){.f,.g,.ic,[class^=c]{animation:none!important}}</style>
