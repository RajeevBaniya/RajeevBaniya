<svg xmlns="http://www.w3.org/2000/svg" width="540" height="428" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#FFFFFF">
<rect width="540" height="428" rx="12" fill="#08112A" stroke="#38BDF8" stroke-opacity=".35"/>
<text x="24" y="40">I'm <tspan fill="#38BDF8" font-weight="700">Rajeev</tspan>, a <tspan fill="#38BDF8" font-weight="700">Full Stack Developer</tspan> who learns by building</text>
<text x="24" y="64">and shipping 🚀. I'd rather put something live than read</text>
<text x="24" y="88">about it for another week. That's how most of what I know</text>
<text x="24" y="112">got learned.</text>
<text x="24" y="150">On the frontend I work with <tspan fill="#38BDF8" font-weight="700">React</tspan> and <tspan fill="#38BDF8" font-weight="700">Next.js</tspan>. On the</text>
<text x="24" y="174">backend it's <tspan fill="#38BDF8" font-weight="700">Node.js</tspan>, <tspan fill="#38BDF8" font-weight="700">Express</tspan> and <tspan fill="#38BDF8" font-weight="700">FastAPI</tspan>. Data lives in</text>
<text x="24" y="198"><tspan fill="#38BDF8" font-weight="700">PostgreSQL</tspan>, <tspan fill="#38BDF8" font-weight="700">MySQL</tspan>, <tspan fill="#38BDF8" font-weight="700">MongoDB</tspan> and <tspan fill="#38BDF8" font-weight="700">Redis</tspan>, depending on the</text>
<text x="24" y="222">shape of the problem. I ship with <tspan fill="#38BDF8" font-weight="700">AWS</tspan>, <tspan fill="#38BDF8" font-weight="700">Docker</tspan> and <tspan fill="#38BDF8" font-weight="700">CI/CD</tspan>,</text>
<text x="24" y="246">so the work doesn't stop at localhost.</text>
<text x="24" y="284">I also build AI features: <tspan fill="#38BDF8" font-weight="700">RAG pipelines</tspan>, <tspan fill="#38BDF8" font-weight="700">LLM integrations</tspan></text>
<text x="24" y="308">and <tspan fill="#38BDF8" font-weight="700">agent workflows</tspan> with <tspan fill="#38BDF8" font-weight="700">LangChain</tspan>, <tspan fill="#38BDF8" font-weight="700">LangGraph</tspan>, Hugging</text>
<text x="24" y="332">Face, <tspan fill="#38BDF8" font-weight="700">vector databases</tspan> and many more. Every new tool goes</text>
<text x="24" y="356">into my projects.</text>
<text x="24" y="394">🌐 Portfolio: <tspan fill="#38BDF8" font-weight="700">baniyarajeev.com.np</tspan></text>
</svg>
